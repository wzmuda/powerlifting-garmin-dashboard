name: Update Garmin dashboard

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore Garmin token
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: |
          test -n "$GARMIN_TOKENS_B64"
          mkdir -p .garmin_tokens
          printf '%s' "$GARMIN_TOKENS_B64" | base64 --decode > .garmin_tokens/garmin_tokens.json
          chmod 600 .garmin_tokens/garmin_tokens.json

      - name: Install analyzer
        run: python -m pip install -r requirements.txt

      - name: Pull Garmin data
        run: python garmin_deadlift_progress.py pull

      - name: Save public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/strength-progress.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh Garmin snapshot" \
              -m "Update the public workout snapshot from the manual dashboard workflow." \
              -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
              -m "Vibe-coded-by: Codex <gpt-5>"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
